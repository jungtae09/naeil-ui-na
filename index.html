<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="매일의 10가지 약속을 지키고, 돌아보고, 조금씩 나아지는 자기관리 앱" />
    <title>내일의 나</title>

    <!-- 홈화면에 추가했을 때 브라우저 주소창 없이 앱처럼 보이게 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="내일의 나" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />

    <!-- 아이콘 -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <!-- 상태바 색. 아래 스크립트와 ThemeContext 가 테마에 맞춰 계속 바꿔준다 -->
    <meta name="theme-color" content="#faf7f2" />

    <script>
      // 테마 깜빡임(FOUC) 방지: 렌더 전에 클래스 적용
      (function () {
        try {
          var t = localStorage.getItem('nn-theme') || 'system'
          var dark =
            t === 'dark' ||
            (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) {
            document.documentElement.classList.add('dark')
            var m = document.querySelector('meta[name="theme-color"]')
            if (m) m.setAttribute('content', '#161618')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
